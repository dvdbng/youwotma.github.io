<script>
  try {
    const url = new URLSearchParams(location.search).get("url");

    if (!url) {
      document.body.textContent = "No URL provided.";
    } else {
      const link = document.createElement("a");
      link.href = url;
      link.textContent = url;
      document.body.append(link);
    }
  } catch (e) {
    alert("Error: " + e.message);
  }
</script>
